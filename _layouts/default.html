<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <div class="container">
    {{ content }}
    <footer>
      <a href="https://github.com/STAT04A/phd_theses">Edit on GitHub</a>
    </footer>
  </div>
<script>
  (function () {
    var el = document.querySelector('.year-nav');
    function setH() {
      document.documentElement.style.setProperty('--top-h', el.offsetHeight + 'px');
    }
    setH();
    addEventListener('resize', setH);
    addEventListener('load', setH);
  })();
</script>
</body>
</html>
